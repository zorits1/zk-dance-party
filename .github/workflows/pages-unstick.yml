name: Beragadt Pages-telepítés eltávolítása
on:
  push:
    paths: ['.github/workflows/pages-unstick.yml']
permissions:
  pages: write
  deployments: write
  contents: read
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          S=3bab033081a7d2d9bcef7c6c221ce3c1e8fd6109
          echo "::notice::pages status: $(gh api repos/$R/pages/deployments/$S --jq .status 2>&1 | head -c 200)"
          gh api -X POST repos/$R/pages/deployments/$S/cancel >/dev/null 2>&1 && echo "::notice::cancel ok" || echo "::warning::cancel hiba"
          for id in $(gh api repos/$R/deployments --jq '.[] | select(.environment=="github-pages") | .id' | head -12); do
            st=$(gh api repos/$R/deployments/$id/statuses --jq '.[0].state' 2>/dev/null)
            if [ "$st" != "success" ]; then
              gh api -X POST repos/$R/deployments/$id/statuses -f state=inactive >/dev/null 2>&1
              gh api -X DELETE repos/$R/deployments/$id >/dev/null 2>&1 && echo "::notice::torolve $id ($st)" || echo "::warning::nem torolheto $id ($st)"
            fi
          done
          sleep 20
          echo "::notice::pages status utana: $(gh api repos/$R/pages/deployments/$S --jq .status 2>&1 | head -c 200)"
