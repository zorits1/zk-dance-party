name: 3D táncos karakterek letöltése (CC0)

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/get_avatars.py'
      - '.github/workflows/avatars.yml'

permissions:
  contents: write

jobs:
  avatars:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Függőségek
        run: pip install pillow
      - name: Letöltés
        run: |
          python tools/get_avatars.py avatars | tee avatars_log.txt
          echo "::notice::$(tail -1 avatars_log.txt)"
          rm avatars_log.txt
      - name: Mentés a repóba
        run: |
          git config user.name "zk-dance-bot"
          git config user.email "zk-dance-bot@users.noreply.github.com"
          git add avatars
          git diff --cached --quiet || git commit -m "3D táncos karakterek (100Avatars, CC0)"
          git pull --rebase || true
          git push
