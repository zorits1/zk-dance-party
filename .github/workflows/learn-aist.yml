name: Profi mozdulatok tanulása (AIST++)

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/learn_aist.py'
      - '.github/workflows/learn-aist.yml'

permissions:
  contents: write

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Függőségek
        run: pip install numpy

      - name: AIST++ 3D kulcspontok letöltése
        run: |
          set -e
          mkdir -p work && cd work
          curl -sSL https://google.github.io/aistplusplus_dataset/download.html -o dl.html
          grep -oE 'https?://[^"'"'"' <>)]+' dl.html | grep -iE '\.(zip|tar|tgz|gz)($|\?)' | sort -u | tee links.txt || true
          URL=$(grep -iE 'keypoints3d' links.txt | head -1 || true)
          [ -z "$URL" ] && URL=$(grep -iE 'fullset|annotation|aist_plusplus' links.txt | head -1 || true)
          if [ -z "$URL" ]; then echo "::error::Nem találtam letöltési linket az AIST++ oldalon"; cat links.txt; exit 1; fi
          echo "Letöltés: $URL"
          curl -sSL --retry 3 "$URL" -o ann.pkg
          ls -la ann.pkg
          mkdir -p ann
          if file ann.pkg | grep -qi zip; then
            unzip -q ann.pkg '*keypoints3d/*' '*ignore_list.txt' -d ann || unzip -q ann.pkg -d ann
          else
            tar -xf ann.pkg -C ann --wildcards '*keypoints3d/*' '*ignore_list.txt' || tar -xf ann.pkg -C ann
          fi
          KP=$(find ann -type d -name keypoints3d | head -1)
          echo "KP_DIR=$PWD/$KP" >> $GITHUB_ENV
          echo "kulcspont-fájlok: $(find "$KP" -name '*.pkl' | wc -l)"

      - name: Tanulás
        run: python tools/learn_aist.py "$KP_DIR" data

      - name: Eredmény mentése a repóba
        run: |
          git config user.name "zk-dance-bot"
          git config user.email "zk-dance-bot@users.noreply.github.com"
          git add data/moves_aist.json data/aist_report.md
          git diff --cached --quiet || git commit -m "Profi mozdulatok frissítése az AIST++ adatbázisból"
          git push
