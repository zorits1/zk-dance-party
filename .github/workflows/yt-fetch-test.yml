name: YouTube-letöltés próba (felhő)
on:
  push:
    paths: ['tools/yt_fetch.py', '.github/workflows/yt-fetch-test.yml']
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null && pip install -q -U yt-dlp
      - run: python tools/yt_fetch.py RFfbZV3bwys /tmp/v.mp4 || true
